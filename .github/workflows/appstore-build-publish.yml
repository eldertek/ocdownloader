name: Build and publish to Nextcloud App Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, gd, intl, json, libxml, mbstring, zip

      - name: Lint PHP files
        run: find lib appinfo templates SERVER -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate appinfo/info.xml against XSD
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

  publish:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package release archive
        run: |
          mkdir -p dist/ocdownloader
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/ocdownloader/
          tar -czf ocdownloader-${GITHUB_REF_NAME}.tar.gz -C dist ocdownloader

      - name: Package and publish to Nextcloud App Store
        if: env.HAS_APPSTORE_TOKEN == 'true'
        env:
          HAS_APPSTORE_TOKEN: ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN != '' }}
        uses: nextcloud/appstore-push-action@v1
        with:
          app_name: ocdownloader
          appstore_token: ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}
          certificate: ${{ secrets.OCDOWNLOADER_CERT }}
          app_private_key: ${{ secrets.OCDOWNLOADER_PRIVATE_KEY }}
